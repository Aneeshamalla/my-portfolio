<head>
  <meta charset="utf-8" />

  <meta name="description" content="Anisha Malla is a full stack developer and BCA graduate building web apps with React, Next.js, FastAPI, Node.js and MySQL, from booking platforms to ML price prediction and RAG backends." />

  <meta name="theme-color" content="#F6F4EF" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0E0D0B" media="(prefers-color-scheme: dark)" />

  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <!-- Apply saved theme before paint (default: follow system) -->
  <script>
    (function () {
      document.documentElement.classList.add('js');
      try {
        var t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
